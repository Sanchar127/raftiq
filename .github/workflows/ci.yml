name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          }

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check generated modules
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Run unit and integration tests
        run: go test ./... -count=1

      - name: Run race detector
        run: go test -race ./... -count=1

      - name: Run chaos tests
        run: go test ./tests/chaos/... -count=1

      - name: Run chaos tests with race detector
        run: go test -race ./tests/chaos/... -count=1

  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build all packages
        run: go build ./...

      - name: Build binaries
        run: |
          if [ -d "./cmd/raftiq" ] && [ "$(find ./cmd/raftiq -type f -name '*.go' -print -quit)" ]; then
            go build ./cmd/raftiq
          fi

          if [ -d "./cmd/scheduler" ] && [ "$(find ./cmd/scheduler -type f -name '*.go' -print -quit)" ]; then
            go build ./cmd/scheduler
          fi