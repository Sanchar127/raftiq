version: "2"

run:
  timeout: 5m

linters:
  default: standard

  settings:
    funlen:
      lines: 150
      statements: 100

    cyclop:
      max-complexity: 15

  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - funlen
    - cyclop
    - gocritic
    - misspell
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unconvert

  exclusions:
    generated: lax

    rules:
      - path: '(_test\.go)$'
        linters:
          - cyclop
          - funlen

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0